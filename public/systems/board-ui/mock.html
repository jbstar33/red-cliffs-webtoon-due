    function card(index) {
      const general = roster[index % roster.length];
      const fullText = fullTexts[general[0]] || "능력 없음.";
      return {
        id: general[0],
        instanceId: `mock-${index}-${Math.random()}`,
        name: general[1],
        courtesy: general[2],
        faction: general[3],
        cost: (index % 6) + 1,
        attack: (index % 5) + 1,
        health: (index % 6) + 2,
        currentAttack: (index % 5) + 1,
        currentHealth: (index % 6) + 2,
        maxHealth: (index % 6) + 2,
        role: general[4],
        text: fullText,
        summaryText: fullText.split(".")[0],
        flavor: `${general[1]}의 이름은 전장의 북소리보다 먼저 적진에 닿았다.`,
        tactics: { identity: tacticalIdentities[general[0]] || `${general[4]} 전술` },
        target: index === 1 ? "enemy" : "none",
        abilities: index === 1 ? [{ trigger: "onPlay", op: "damage_target", amount: 3 }] : [],
        keywords: keywordSets[general[0]] || [],
        guard: (keywordSets[general[0]] || []).includes("수호"),
        shield: (keywordSets[general[0]] || []).includes("방패"),
        canAttack: true,
        attacksLeft: 1,
        portrait: { motif: general[4], weapon: "장창", temperament: "굳건함" },
      };
    }
    const mockParams = new URLSearchParams(location.search);

      document.body.classList.add("gallery-mode");
      TK.modules.boardUI.renderPortraitGallery(
        document.getElementById("portrait-gallery"),
        roster.map((_, index) => card(index)),
      );
    }

      phase: "playing",
      turn: "player",
      turnNumber: 5,
      winner: null,
      reason: "",
      heroes: {
        player: { health: 24, maxHealth: 30, armor: 3, mana: 7, maxMana: 7, fatigue: 0 },
        ai: { health: 18, maxHealth: 30, armor: 0, mana: 6, maxMana: 6, fatigue: 0 },
      },
      commanders: {
        player: { id: "caocao", faction: "wei", powerUsedThisTurn: false },
        ai: { id: "liubei", faction: "shu", reflectCharges: 2 },
      },
      hands: { player: [card(10), card(11), card(12), card(13), card(14), card(15), card(16), card(17), card(18)], ai: [card(0), card(1), card(2), card(3)] },
      decks: { player: Array(12).fill(0), ai: Array(9).fill(0) },
      boards: {
        player: [card(5), card(6), card(7), card(8), card(9)],
        ai: [
          Object.assign(card(0), { canAttack: false }),
          card(1),
          card(2),
          Object.assign(card(3), { shield: false }),
          card(4),
        ],
      },
      log: [
        { id: 1, actor: "player", message: "조자룡을 출전시켰습니다." },
        { id: 2, actor: "ai", message: "감녕이 수호 태세를 취합니다." },
        { id: 3, actor: "player", message: "카드를 한 장 뽑았습니다." },
        { id: 4, type: "action:invalid", actor: "player", message: "insufficient_mana", data: { reason: "insufficient_mana" } },
      ],
      revision: 1,
    };
    const mockHandCount = Number(mockParams.get("hand"));
    if (mockHandCount === 1 || mockHandCount === 2) {
      state.hands.player = state.hands.player.slice(0, mockHandCount);
    }
    if (mockParams.get("scenario") === "defeat") {
      state.phase = "ended";
      state.winner = "ai";
      state.reason = "hero_defeated";
    }
    const ui = TK.modules.boardUI.createBoardUI({
      root: document.getElementById("game"),
      canvas: document.getElementById("board"),
      getState: () => state,
      requestAudioUnlock() {},
      dispatch(action) {
        if (action.type === "PLAY_CARD") {
          const played = state.hands.player.splice(action.handIndex, 1)[0];
          if (played && state.boards.player.length < 5) {
            state.heroes.player.mana -= played.cost;
            state.boards.player.push(Object.assign(played, { canAttack: played.keywords.includes("돌진") }));
            state.log.push({ id: Date.now(), actor: "player", message: `${played.name} 출전!` });
            ui.handleEvent("card:play", { message: `${played.name}이 전장에 나섰습니다.` });
          }
        } else if (action.type === "ATTACK") {
          const attacker = state.boards.player[action.attackerIndex];
          attacker.canAttack = false;
          state.log.push({ id: Date.now(), actor: "player", message: `${attacker.name}이 공격했습니다.` });
          ui.handleEvent("attack:hit", { target: action.target, amount: attacker.currentAttack });
        } else if (action.type === "END_TURN") {
          state.turn = "ai";
          ui.setThinking(true);
          setTimeout(() => {
            state.turn = "player";
            state.turnNumber += 1;
            state.heroes.player.maxMana = Math.min(10, state.heroes.player.maxMana + 1);
            state.heroes.player.mana = state.heroes.player.maxMana;
            state.boards.player.forEach((minion) => { minion.canAttack = true; });
            state.revision += 1;
            ui.setThinking(false);
            ui.handleEvent("turn:start", { side: "player" });
          }, 1100);
        } else if (action.type === "CONCEDE") {
          state.phase = "ended";
          state.winner = "ai";
          state.reason = "깃발을 거두고 훗날을 기약했습니다.";
          state.revision += 1;
        } else if (action.type === "RESTART") {
          location.reload();
        }
        state.revision += 1;
        ui.render(state);
      },
    });
    ui.handleEvent("turn:start", { side: "player" });
    if (mockParams.get("scenario") === "invalid") {
      ui.handleEvent("action:invalid", { actor: "player", reason: "insufficient_mana" });
    }
